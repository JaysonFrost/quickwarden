[package]
name = "quickwarden"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Quick access for Bitwarden: a global-hotkey password picker with autofill, TOTP and Windows Hello for Windows and macOS"
license = "MIT"
repository = "https://github.com/JaysonFrost/quickwarden"
readme = "README.md"
keywords = ["bitwarden", "password-manager", "autofill", "totp", "quick-access"]
categories = ["authentication", "gui"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
aes-gcm = "0.11.1"
arboard = "3.7.0"
eframe = "0.37.0"
enigo = "0.6.1"
getrandom = "0.4.3"
global-hotkey = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
totp-rs = { version = "6.0.0", features = ["otpauth"] }

[target."cfg(windows)".dependencies]
uiautomation = "0.25.1"
windows = { version = "0.62.2", features = ["Security_Credentials", "Security_Cryptography", "Storage_Streams", "Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_Security_Cryptography"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }
