[package]
name = "bwquick"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
eframe = "0.37.0"
enigo = "0.6.1"
global-hotkey = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
totp-rs = { version = "6.0.0", features = ["otpauth"] }

[target."cfg(windows)".dependencies]
uiautomation = "0.25.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }
